# Netlify Configuration for Prompt Gym Version B (Test)
[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Next.js plugin handles all routing
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables needed (set in Netlify dashboard):
# - NEXT_PUBLIC_SUPABASE_URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY (for webhooks)
#
# For Version B (test mode):
# - No Stripe keys needed (mock payments)
