# Netlify Configuration for Prompt Gym Version B (Test)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Version B is set in app/config/site.ts

# Next.js specific settings
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect all routes to Next.js
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/___netlify-handler"
  status = 200

# Environment variables needed (set in Netlify dashboard):
# - NEXT_PUBLIC_SUPABASE_URL
# - NEXT_PUBLIC_SUPABASE_ANON_KEY
# - SUPABASE_SERVICE_ROLE_KEY (for webhooks)
#
# For Version B (test mode):
# - No Stripe keys needed (mock payments)
